name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-swift-format:
    name: Lint (swift-format)
    runs-on: ubuntu-latest
    container:
      image: swift:6.3-jammy
    steps:
      - uses: actions/checkout@v4
      - name: swift-format version
        run: swift-format --version
      - name: Lint
        run: swift format lint --recursive --strict --configuration .swift-format Package.swift Sources Tests

  lint-link-only-imports:
    name: Lint (link-only C targets — never import from Swift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject `import CZenohPico` / `import CCycloneDDS`
        # CZenohPico and CCycloneDDS are link-only binary targets — they
        # are consumed at the C level by CZenohBridge / CDDSBridge with
        # platform-specific cSettings defines applied. On Apple, the
        # `.xcframework`'s auto-synthesised modulemap means a stray
        # `import CZenohPico` in Swift compiles silently; on Linux the
        # source-build path has no synthesised modulemap, so the same
        # import would fail there. Catch it at lint time across all
        # platforms instead of letting one CI matrix entry fail
        # confusingly. See https://github.com/swift-ros2/swift-ros2/issues/26.
        #
        # Pattern uses `grep -P` (PCRE) rather than `grep -E` so `\b`
        # is the well-defined word-boundary it looks like, not the
        # POSIX-ERE backspace escape (a GNU extension at best).
        run: |
          set -euo pipefail
          if grep -rPn '^import C(ZenohPico|CycloneDDS)\b' Sources Tests; then
            echo
            echo "::error::Found a Swift `import` of a link-only C target above."
            echo "::error::Use `import SwiftROS2Zenoh` / `import SwiftROS2DDS` to reach the bridges."
            exit 1
          fi

  parity-matrix:
    name: Parity matrix drift guard
    runs-on: ubuntu-latest
    container:
      image: swift:6.3-jammy
    steps:
      # `submodules: recursive` is required even though parity-tool itself
      # depends on nothing under vendor/: `swift run parity-tool` makes
      # SwiftPM load the WHOLE package graph, which path-validates the
      # Linux-arm source targets (CZenohPico over vendor/zenoh-pico). The
      # dirs must exist or resolution errors — building only parity-tool
      # still avoids compiling CycloneDDS / zenoh-pico.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate matrix JSON
        run: swift run parity-tool validate
      - name: Re-render, canonicalize, and check for drift
        run: |
          swift run parity-tool render
          swift run parity-tool canonicalize
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code docs/PARITY.md docs/parity-matrix.json

  build-macos:
    name: Build & Test (macOS)
    needs: [lint-swift-format]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.4.1.app
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      # The tests gated on ZENOH_ROUTER (concurrent puts, reliable publishers, matching, actions,
      # the stalled-link relay) need a real router: start a loopback-only zenohd. The tests gated
      # on LINUX_IP need a ROS 2 host with a CLI subscriber or publisher and stay skipped here.
      - name: Start zenohd
        run: bash Scripts/ci-start-zenohd.sh
      - name: Test (with coverage)
        env:
          ZENOH_ROUTER: tcp/127.0.0.1:7447
        run: swift test --parallel --enable-code-coverage
      - name: Coverage gate
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          PROF_DATA="${BIN_PATH}/codecov/default.profdata"
          if [[ ! -f "$PROF_DATA" ]]; then
            echo "ERROR: no profdata at $PROF_DATA" >&2
            exit 1
          fi
          XCTEST_BINS=()
          while IFS= read -r line; do
            XCTEST_BINS+=("$line")
          done < <(find "$BIN_PATH" -name "*.xctest" -type d)
          BINARY_ARGS=()
          for bundle in "${XCTEST_BINS[@]}"; do
            name=$(basename "$bundle" .xctest)
            BINARY_ARGS+=("$bundle/Contents/MacOS/$name")
          done
          xcrun llvm-cov report \
            "${BINARY_ARGS[@]}" \
            -instr-profile="$PROF_DATA" \
            -ignore-filename-regex="(\\.build/|Tests/|vendor/)" \
            -summary-only \
            > coverage-summary.txt
          bash Scripts/coverage-gate.sh coverage-summary.txt
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary.txt
          if-no-files-found: ignore

  # The build-macos job links the CZenohPico xcframework that Package.swift pins
  # (a release asset), so it never tests the zenoh-pico in vendor/. This job
  # builds CZenohPico from this source and runs the zenoh-pico regression tests
  # against it, before the change ships in a release asset.
  test-macos-local-zenoh-pico:
    name: Test (macOS, CZenohPico from source)
    needs: [lint-swift-format]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.4.1.app
      - name: Install CMake
        run: command -v cmake || brew install cmake
      - name: Build CZenohPico.xcframework
        run: bash Scripts/build-xcframework.sh zenoh-pico build/zenoh-pico
      - name: Start zenohd
        run: bash Scripts/ci-start-zenohd.sh
      - name: Test
        env:
          SWIFT_ROS2_ZENOH_LOCAL: "1"
          ZENOH_ROUTER: tcp/127.0.0.1:7447
        run: swift test --filter SwiftROS2ZenohTests.ZenohLargeMessageTests

  check-api-stability:
    name: Check (API stability vs latest release)
    needs: [lint-swift-format]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # full history so all semver tags are reachable
      - name: Resolve latest 3.x release tag
        id: baseline
        run: |
          set -euo pipefail
          # Latest stable 3.x tag; until 3.0.0 exists, the latest 3.0.0
          # release candidate, so the gate is on during the 3.0 cycle.
          tag=$(git tag -l '3.[0-9]*.[0-9]*' | awk '!/-/' | sort -V | tail -n1)
          if [[ -z "$tag" ]]; then
            tag=$(git tag -l '3.0.0-rc.*' | sort -t. -k4,4n | tail -n1)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ -z "$tag" ]]; then
            echo "::notice::no 3.x tag yet; skipping"
          else
            echo "Baseline: $tag"
          fi
      - name: Select Xcode
        if: steps.baseline.outputs.tag != ''
        run: sudo xcode-select -switch /Applications/Xcode_26.4.1.app
      - name: Swift version
        if: steps.baseline.outputs.tag != ''
        run: swift --version
      - name: Diagnose API breaking changes
        if: steps.baseline.outputs.tag != ''
        env:
          # Digest the SAME module graph on both sides of the diff: with the
          # RCL family in the graph, swift-api-digester emits a partial
          # umbrella digest and misreports the whole public surface as
          # removed against a non-RCL baseline. The RCL-off graph still
          # covers the entire frozen 2.x public surface (SwiftROS2RCL itself
          # has no public API and is skipped as absent-from-baseline).
          SWIFT_ROS2_DISABLE_RCL: "1"
        run: bash Scripts/diagnose-api-breaking-changes.sh "${{ steps.baseline.outputs.tag }}" Scripts/api-breakage-allowlist.txt

  build-docs:
    name: Build (DocC)
    needs: [lint-swift-format]
    runs-on: macos-26
    env:
      SWIFT_ROS2_DOCS_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.4.1.app
      - name: Generate DocC
        run: swift package generate-documentation --target SwiftROS2
      - name: Check DocC coverage
        run: bash Scripts/check-docc-coverage.sh

  build-linux:
    name: Build & Test (Ubuntu ${{ matrix.ubuntu_version }} ${{ matrix.arch }} + ROS 2 ${{ matrix.ros_distro }})
    needs: [lint-swift-format]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
            ubuntu_version: "22.04"
            arch: x86_64
            runner: ubuntu-22.04
          - ros_distro: humble
            ubuntu_version: "22.04"
            arch: aarch64
            runner: ubuntu-22.04-arm
          - ros_distro: jazzy
            ubuntu_version: "24.04"
            arch: x86_64
            runner: ubuntu-24.04
          - ros_distro: jazzy
            ubuntu_version: "24.04"
            arch: aarch64
            runner: ubuntu-24.04-arm
          - ros_distro: rolling
            ubuntu_version: "24.04"
            arch: x86_64
            runner: ubuntu-24.04
          - ros_distro: rolling
            ubuntu_version: "24.04"
            arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system dependencies
        run: |
          # Retry package downloads: the Ubuntu and ROS mirrors fail now and then.
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config curl gnupg lsb-release software-properties-common
      - name: Install ROS 2 ${{ matrix.ros_distro }} CycloneDDS
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/share/keyrings
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
            https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            | sudo tee /usr/share/keyrings/ros-archive-keyring.gpg > /dev/null
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y ros-${{ matrix.ros_distro }}-cyclonedds
      - name: Install Swift 6.3.1
        uses: ./.github/actions/install-swift-linux
        with:
          version: "6.3.1"
          ubuntu-version: ${{ matrix.ubuntu_version }}
      - name: Swift version
        run: swift --version
      - name: Verify Linux deps
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          export PKG_CONFIG_PATH="/opt/ros/${{ matrix.ros_distro }}/lib/${{ matrix.arch }}-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}"
          bash Scripts/build-linux-deps.sh
      - name: Build
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          export PKG_CONFIG_PATH="/opt/ros/${{ matrix.ros_distro }}/lib/${{ matrix.arch }}-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}"
          bash Scripts/swiftpm-retry.sh swift build
      # One leg also runs the tests gated on ZENOH_ROUTER against a loopback-only zenohd (the macOS
      # job does the same; this covers the Linux build of the wire Zenoh client).
      - name: Start zenohd
        if: matrix.ros_distro == 'jazzy' && matrix.arch == 'x86_64'
        run: bash Scripts/ci-start-zenohd.sh
      - name: Test
        env:
          ZENOH_ROUTER: ${{ matrix.ros_distro == 'jazzy' && matrix.arch == 'x86_64' && 'tcp/127.0.0.1:7447' || '' }}
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          export PKG_CONFIG_PATH="/opt/ros/${{ matrix.ros_distro }}/lib/${{ matrix.arch }}-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}"
          bash Scripts/swiftpm-retry.sh swift test --parallel

      # The router-loss tests kill and pause their router, so it is a separate Docker container on its
      # own port rather than the shared zenohd above.
      - name: Test router loss (Docker zenohd)
        if: matrix.ros_distro == 'jazzy' && matrix.arch == 'x86_64'
        env:
          ZENOH_ROUTER: tcp/127.0.0.1:7448
          ZENOH_TEST_ROUTER_CONTAINER: sr2-router
        run: |
          docker run -d --name sr2-router -p 127.0.0.1:7448:7447 eclipse/zenoh:1.10.1
          for _ in $(seq 30); do nc -z 127.0.0.1 7448 && break; sleep 1; done
          nc -z 127.0.0.1 7448 || { echo "::error::router container did not open port 7448"; docker logs sr2-router; exit 1; }
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          export PKG_CONFIG_PATH="/opt/ros/${{ matrix.ros_distro }}/lib/${{ matrix.arch }}-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}"
          bash Scripts/swiftpm-retry.sh swift test --filter ZenohLostRouterIntegrationTests

  verify-manifest-arms:
    name: Check (manifest on all arms)
    needs: [lint-swift-format]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.4.1.app
      - name: Verify umbrella target visible on every arm
        run: |
          for arm in apple linux windows android; do
            echo "=== SWIFT_ROS2_TARGET_OS=$arm ==="
            SWIFT_ROS2_TARGET_OS=$arm swift package describe --type json \
              | jq -e '.targets[] | select(.name == "SwiftROS2") | .name' \
              || (echo "SwiftROS2 umbrella missing on arm=$arm"; exit 1)
          done
          # Android has no CycloneDDS: the umbrella must not depend on SwiftROS2DDS there.
          SWIFT_ROS2_TARGET_OS=android swift package describe --type json \
            | jq -e '.targets[] | select(.name == "SwiftROS2")
                     | (.target_dependencies | index("SwiftROS2DDS")) == null' \
            || (echo "SwiftROS2 must not depend on SwiftROS2DDS on android"; exit 1)

      - name: Verify wire clients are not public products
        run: |
          # 2.0.0: the wire runtime is an internal fallback behind ROS2Context;
          # SwiftROS2Zenoh / SwiftROS2DDS must never come back as products.
          for arm in apple linux windows android; do
            echo "=== SWIFT_ROS2_TARGET_OS=$arm ==="
            SWIFT_ROS2_TARGET_OS=$arm swift package describe --type json \
              | jq -e '[.products[].name]
                       | (index("SwiftROS2Zenoh") == null and index("SwiftROS2DDS") == null)' \
              || (echo "wire client product exposed on arm=$arm"; exit 1)
          done

  build-windows:
    name: Build & Test (Windows x86_64)
    needs: [lint-swift-format]
    runs-on: windows-latest
    # The whole matrix is on Swift 6.3.1: macOS uses Xcode 26.4.1 (Swift
    # 6.3.1), Linux downloads the 6.3.1 toolchain directly, and Android
    # uses the 6.3.1 SDK. Windows historically required a newer Swift
    # than the rest because 6.0.x's Windows SDK shim assumes older
    # Windows Kits headers than the current windows-latest runner image
    # ships (failing with "could not build module 'ucrt'") — that
    # divergence is gone now that everyone's on 6.3.1.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The setup runs twice at most. The 2026-10-15 failure (`swift --version`
      # exited with 0xC0000135, STATUS_DLL_NOT_FOUND, right after a 93 s install
      # that returned exit code 0) was a one-off broken install on a fresh
      # runner: the next run of the same job on the same image passed. The
      # action's own `swift --version` check already catches that, so the first
      # attempt may fail and the second reinstalls with /repair. The installer
      # download is not cached: it is 1.76 GB, fetched in about 6 s, and the
      # action would cache a truncated file when its download fails.
      - name: Install Swift 6.3.1
        id: setup-swift
        continue-on-error: true
        uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5 # v0.4.0
        with:
          branch: swift-6.3.1-release
          tag: 6.3.1-RELEASE
      - name: Show the installer log of the failed Swift setup
        if: steps.setup-swift.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "::warning::Swift setup failed; repairing the installation once"
          Get-ChildItem "$env:TEMP\install*.log" -ErrorAction SilentlyContinue | Format-Table Name, Length
          Get-Content "$env:TEMP\install.log" -Tail 60 -ErrorAction SilentlyContinue
          Get-ChildItem "$env:LOCALAPPDATA\Programs\Swift" -Depth 2 -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
      - name: Install Swift 6.3.1 (repair after a failed setup)
        if: steps.setup-swift.outcome == 'failure'
        uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5 # v0.4.0
        with:
          branch: swift-6.3.1-release
          tag: 6.3.1-RELEASE
          installer-args: /repair
      - name: Swift version
        run: swift --version
      # CycloneDDS via vcpkg (parallel to the Linux pkg-config + apt path).
      # `windows-latest` ships vcpkg pre-installed at $VCPKG_INSTALLATION_ROOT.
      # `cyclonedds:x64-windows` is dynamic (DLL + import lib) — `bin/`
      # lands on PATH so ddsc.dll resolves at test runtime, and Package.swift
      # reads CYCLONEDDS_DIR to wire `-I<dir>/include` + `-L<dir>/lib`
      # into CDDSBridge. Without this step the manifest falls back to the
      # 0.5.0–0.7.0 Zenoh-only Windows shape.
      - name: Install CycloneDDS via vcpkg
        shell: bash
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install cyclonedds:x64-windows
          # Forward-slash the path so the value Package.swift reads is
          # uniform regardless of how Windows runners hand off env vars
          # to bash. Backslashes survive `>> $GITHUB_ENV`, mixed
          # separators trip up some tools.
          CYCLONEDDS_PREFIX="${VCPKG_INSTALLATION_ROOT//\\//}/installed/x64-windows"
          echo "CYCLONEDDS_DIR=$CYCLONEDDS_PREFIX" >> "$GITHUB_ENV"
          echo "$CYCLONEDDS_PREFIX/bin" >> "$GITHUB_PATH"
      - name: Verify CycloneDDS install
        shell: bash
        run: |
          echo "CYCLONEDDS_DIR=$CYCLONEDDS_DIR"
          ls "$CYCLONEDDS_DIR/include/dds/dds.h"
          ls "$CYCLONEDDS_DIR/lib/ddsc.lib"
          ls "$CYCLONEDDS_DIR/bin/ddsc.dll"
      - name: Build
        run: swift build
      - name: Test
        run: swift test --parallel

  build-android:
    name: Build (Android ${{ matrix.abi }})
    needs: [lint-swift-format]
    # Pin explicitly to ubuntu-24.04 — the Swift 6.3.1 tarball downloaded
    # below is the ubuntu24.04 build, so the runner must stay on 24.04.
    # Using ubuntu-latest would break Android CI the day GitHub promotes
    # 26.04 (glibc / libstdc++ mismatch against the 24.04 swiftmodule).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triple: aarch64-unknown-linux-android28
          - abi: x86_64
            triple: x86_64-unknown-linux-android28
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Swift 6.3.1 — matches the Android SDK below. compnerd/gha-setup-swift
      # silently installs Swift 6.3 on Linux regardless of `tag:`, which
      # mismatches the SDK's prebuilt swiftmodules (\"module compiled
      # with Swift 6.3.1 cannot be imported by the Swift 6.3 compiler\").
      # Download directly from swift.org instead, same pattern as
      # build-linux above.
      - name: Install Swift 6.3.1
        uses: ./.github/actions/install-swift-linux
        with:
          version: "6.3.1"
          ubuntu-version: "24.04"
      # The Swift Android SDK artifact bundle does not ship its own
      # ndk-sysroot — it ships a setup-android-sdk.sh script that
      # hydrates ndk-sysroot from a locally installed NDK in-place.
      # Without running it, clang can't find <sys/time.h> / <string.h>
      # under the SDK's --sysroot. The script requires NDK >= r27.
      - name: Install Android NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false
      # The bundle is downloaded with curl (which retries) into the Actions
      # cache and installed from the local file. SwiftPM's own downloader
      # segfaulted inside libFoundationNetworking on 2026-10-15.
      - name: Install Swift Android SDK
        uses: ./.github/actions/install-swift-android-sdk
        with:
          # Pinned via repository variables so values can be rotated
          # without a code change. Set both at
          # github.com/swift-ros2/swift-ros2/settings/variables/actions:
          #   SWIFT_ANDROID_SDK_URL      — full https URL of the
          #                                .artifactbundle from
          #                                swift.org/documentation/articles/
          #                                swift-sdk-for-android-getting-started.html
          #   SWIFT_ANDROID_SDK_CHECKSUM — SHA-256 hex string from the
          #                                same page
          # If either is unset, the action fails fast with an actionable
          # message.
          sdk-url: ${{ vars.SWIFT_ANDROID_SDK_URL }}
          sdk-checksum: ${{ vars.SWIFT_ANDROID_SDK_CHECKSUM }}
          ndk-path: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Swift version
        run: swift --version
      - name: Build
        # SWIFT_ROS2_TARGET_OS — Package.swift reads this to pick the
        # Android arm when cross-compiling from a Linux host, since
        # `#if os(Android)` at manifest scope reflects the host.
        env:
          SWIFT_ROS2_TARGET_OS: android
        run: swift build --swift-sdk ${{ matrix.triple }} -v
