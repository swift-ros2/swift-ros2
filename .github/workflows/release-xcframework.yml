name: Release xcframeworks

on:
  push:
    tags:
      # Bare-semver tags (Apple-style): 1.2.3, 1.2.3-beta1, etc.
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach artifacts to"
        required: true

concurrency:
  group: release-xcframework-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Creates the GitHub release first, with the tag's CHANGELOG.md section followed by
  # GitHub's list of merged pull requests. A suffixed tag (3.1.0-rc.1) becomes a
  # pre-release; a final version becomes Latest only when it is the highest final
  # version, so a patch on an older line (3.0.3 after 3.1.0) does not take Latest.
  # An existing release is left as it is. publish-xcframeworks uploads into it.
  release:
    name: Publish the release (notes)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Take the notes from CHANGELOG.md
        run: |
          set -euo pipefail
          # The lines under "## <tag>", "## <tag> - <date>" or "## [<tag>] - <date>",
          # up to the next "## " heading.
          awk -v v="$TAG" '
            /^## / { if (found) exit; h = $0; sub(/^## \[?/, "", h); split(h, a, /[] ]/); found = (a[1] == v); next }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no section for $TAG"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the release
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as it is."
            exit 0
          fi
          case "$TAG" in
            *-*) kind=(--prerelease --latest=false) ;;
            *)
              highest=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' | grep -v -- - | sort -V | tail -n 1)
              if [ "$TAG" = "$highest" ]; then kind=(--latest); else kind=(--latest=false); fi
              ;;
          esac
          gh release create "$TAG" --title "$TAG" --verify-tag \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "${kind[@]}"

  build-xcframework:
    name: Build (${{ matrix.framework }}.xcframework)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        framework:
          - zenoh-pico
          - cyclonedds
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # A workflow_dispatch recovery run must build the TAGGED source —
          # without an explicit ref it would build the dispatch ref (main)
          # and attach assets that do not match the tag.
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"
      - name: Install CMake
        run: |
          brew update
          brew install cmake
      - name: Build xcframework
        run: Scripts/build-xcframework.sh ${{ matrix.framework }} artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.framework }}-xcframework
          path: |
            artifacts/*.zip
            artifacts/*.checksum
          if-no-files-found: error
          retention-days: 7

  build-ros2-xcframework:
    name: Build (${{ matrix.framework }}.xcframework)
    # macos-26 + Xcode 26.4.1 to match ci-rcl.yml (the toolchain the ROS 2
    # cross-build is validated on). All six Apple slices per rmw variant.
    runs-on: macos-26
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: CRos2
            rmw_variant: cyclonedds
            slices: maccatalyst iphoneos iphonesimulator macosx xros xrsimulator
            build_dir: build/ros2
          # No xros/xrsimulator for the zenoh variant: zenoh-c's dependency
          # graph (pnet_sys 0.35) does not compile for visionOS yet, so those
          # slices are dropped by design — visionOS consumers stay on the
          # zenoh-pico wire path or the .dds transport.
          - framework: CRos2Zenoh
            rmw_variant: zenoh
            slices: maccatalyst iphoneos iphonesimulator macosx
            build_dir: build/ros2zenoh
    steps:
      - uses: actions/checkout@v4
        with:
          # Same tagged-source rule as the zenoh-pico/cyclonedds job above.
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.4.1.app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: brew install cmake
      # ament_cmake's package_xml_2_cmake.py runs under the runner's base
      # python (CMake's FindPython resolves to it, not the script's venv), so
      # the ROS 2 build deps must be importable there too.
      - name: Install ROS 2 build deps into runner python
        run: pip install -r Scripts/ros2/requirements.txt
      # The zenoh variant cross-builds zenoh-c (Rust staticlib) per slice.
      # This pre-warm targets the runner's default toolchain; build_zenohc
      # re-adds each target scoped to zenoh-c's pinned toolchain (its
      # rust-toolchain.toml governs the actual build). No visionOS triples:
      # the zenoh matrix ships no xros/xrsimulator slices (pnet_sys).
      - name: Install Rust cross targets (zenoh variant)
        if: matrix.rmw_variant == 'zenoh'
        run: |
          rustup target add \
            aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim \
            aarch64-apple-ios-macabi
      - name: Build ${{ matrix.framework }}.xcframework (all slices)
        env:
          RMW_VARIANT: ${{ matrix.rmw_variant }}
        run: Scripts/build-ros2-xcframework.sh ${{ matrix.slices }}
      - name: Zip + checksum
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ditto -c -k --keepParent \
            "${{ matrix.build_dir }}/${{ matrix.framework }}.xcframework" \
            "artifacts/${{ matrix.framework }}.xcframework.zip"
          swift package compute-checksum \
            "artifacts/${{ matrix.framework }}.xcframework.zip" \
            > "artifacts/${{ matrix.framework }}.xcframework.zip.checksum"
          cat "artifacts/${{ matrix.framework }}.xcframework.zip.checksum"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.framework }}-xcframework
          path: |
            artifacts/*.zip
            artifacts/*.checksum
          if-no-files-found: error
          retention-days: 7

  publish-xcframeworks:
    name: Publish (xcframeworks)
    # Publishing is intentionally gated on BOTH build jobs: once Package.swift
    # pins the CRos2* URLs, a release without the ros2 assets would be
    # broken for downstream anyway. The cost is that a transient failure in
    # the long ros2 cross-build blocks the whole release — RECOVERY: re-run
    # this workflow via workflow_dispatch with the existing tag; it rebuilds
    # and re-attaches (--clobber) all assets.
    needs: [release, build-xcframework, build-ros2-xcframework]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p upload
          find artifacts -type f \( -name "*.zip" -o -name "*.checksum" \) -exec cp {} upload/ \;
          ls -la upload
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber \
            upload/CZenohPico.xcframework.zip \
            upload/CZenohPico.xcframework.zip.checksum \
            upload/CCycloneDDS.xcframework.zip \
            upload/CCycloneDDS.xcframework.zip.checksum \
            upload/CRos2.xcframework.zip \
            upload/CRos2.xcframework.zip.checksum \
            upload/CRos2Zenoh.xcframework.zip \
            upload/CRos2Zenoh.xcframework.zip.checksum

      - name: Assert all expected assets present on the release
        # Fail loudly if the release is missing any expected asset.
        # The matrix `include:` shape used in build-xcframework can
        # silently drop a variant before upload, leading to incomplete
        # published bundles that look fine in workflow logs but break
        # `swift build` for the downstream consumer hitting the
        # missing slice. Caught late in #32 (Linux .artifactbundle);
        # the same matrix shape is reused in the Android release
        # pipeline (#29, #31). See https://github.com/swift-ros2/swift-ros2/issues/35.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          expected=(
            CZenohPico.xcframework.zip
            CZenohPico.xcframework.zip.checksum
            CCycloneDDS.xcframework.zip
            CCycloneDDS.xcframework.zip.checksum
            CRos2.xcframework.zip
            CRos2.xcframework.zip.checksum
            CRos2Zenoh.xcframework.zip
            CRos2Zenoh.xcframework.zip.checksum
          )
          actual=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | sort)
          echo "Actual assets on release $TAG:"
          while IFS= read -r line; do echo "  $line"; done <<<"$actual"
          missing=()
          for name in "${expected[@]}"; do
            if ! grep -Fxq "$name" <<<"$actual"; then
              missing+=("$name")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo
            echo "::error::Release $TAG is missing ${#missing[@]} expected asset(s):"
            printf '::error::  %s\n' "${missing[@]}"
            echo "::error::This usually means the build-xcframework matrix dropped a variant before upload."
            exit 1
          fi
          echo
          echo "All ${#expected[@]} expected assets present on release $TAG."
