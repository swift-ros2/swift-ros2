name: Release xcframeworks

on:
  push:
    tags:
      # Bare-semver tags (Apple-style): 1.2.3, 1.2.3-beta1, etc.
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach artifacts to"
        required: true
      force_build:
        description: "Build every xcframework, even one whose inputs match the previous release"
        type: boolean
        default: false

concurrency:
  group: release-xcframework-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decides which xcframeworks this tag builds. A group whose inputs are the same
  # as at the previous release tag (the nearest one in the tag's history) takes
  # that release's assets as they are: same bytes, same checksums. The ROS 2
  # cross-build alone takes about two hours, and Package.swift pins the assets of
  # one release, so most releases have nothing to rebuild.
  # Inputs are the files the build scripts read:
  #   CZenohPico + CCycloneDDS: Scripts/build-xcframework.sh, vendor/zenoh-pico,
  #                             vendor/cyclonedds
  #   CRos2 + CRos2Zenoh:       Scripts/build-ros2-xcframework.sh, Scripts/ros2/
  # The toolchain this workflow selects (runner image, Xcode, CMake, Rust) is not
  # an input: after a toolchain change, run the workflow by hand with force_build.
  plan:
    name: Plan (build or reuse)
    runs-on: ubuntu-24.04
    outputs:
      build_native: ${{ steps.plan.outputs.build_native }}
      build_ros2: ${{ steps.plan.outputs.build_ros2 }}
      previous: ${{ steps.plan.outputs.previous }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
      FORCE_BUILD: ${{ inputs.force_build && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Compare the inputs with the previous release
        id: plan
        run: |
          set -euo pipefail
          previous=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' "$TAG^" 2>/dev/null || true)
          assets=""
          if [[ -n "$previous" ]]; then
            assets=$(gh release view "$previous" --json assets --jq '.assets[].name' 2>/dev/null || true)
          fi
          # build_<group> stays true unless the group can be reused: not forced,
          # unchanged inputs, and the previous release carries all of its assets.
          reusable() {  # $1 = space-separated assets, $2... = input paths
            local names="$1"; shift
            [[ "$FORCE_BUILD" != true && -n "$previous" ]] || return 1
            git diff --quiet "$previous" "$TAG" -- "$@" || return 1
            local name
            for name in $names; do
              grep -Fxq "$name" <<<"$assets" || return 1
            done
          }
          build_native=true
          if reusable "CZenohPico.xcframework.zip CZenohPico.xcframework.zip.checksum CCycloneDDS.xcframework.zip CCycloneDDS.xcframework.zip.checksum" \
              Scripts/build-xcframework.sh vendor/zenoh-pico vendor/cyclonedds; then
            build_native=false
          fi
          build_ros2=true
          if reusable "CRos2.xcframework.zip CRos2.xcframework.zip.checksum CRos2Zenoh.xcframework.zip CRos2Zenoh.xcframework.zip.checksum" \
              Scripts/build-ros2-xcframework.sh Scripts/ros2; then
            build_ros2=false
          fi
          {
            echo "previous=$previous"
            echo "build_native=$build_native"
            echo "build_ros2=$build_ros2"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Previous release: ${previous:-none}"
            echo
            echo "- CZenohPico + CCycloneDDS: $([[ $build_native == true ]] && echo build || echo "reuse from $previous")"
            echo "- CRos2 + CRos2Zenoh: $([[ $build_ros2 == true ]] && echo build || echo "reuse from $previous")"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Creates the GitHub release first, with the tag's CHANGELOG.md section followed by
  # GitHub's list of merged pull requests. A suffixed tag (3.1.0-rc.1) becomes a
  # pre-release; a final version becomes Latest only when it is the highest final
  # version, so a patch on an older line (3.0.3 after 3.1.0) does not take Latest.
  # An existing release is left as it is. publish-xcframeworks uploads into it.
  release:
    name: Publish the release (notes)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Take the notes from CHANGELOG.md
        run: |
          set -euo pipefail
          # The lines under "## <tag>", "## <tag> - <date>" or "## [<tag>] - <date>",
          # up to the next "## " heading.
          awk -v v="$TAG" '
            /^## / { if (found) exit; h = $0; sub(/^## \[?/, "", h); split(h, a, /[] ]/); found = (a[1] == v); next }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no section for $TAG"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the release
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as it is."
            exit 0
          fi
          case "$TAG" in
            *-*) kind=(--prerelease --latest=false) ;;
            *)
              highest=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' | grep -v -- - | sort -V | tail -n 1)
              if [ "$TAG" = "$highest" ]; then kind=(--latest); else kind=(--latest=false); fi
              ;;
          esac
          gh release create "$TAG" --title "$TAG" --verify-tag \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "${kind[@]}"

  build-xcframework:
    name: Build (${{ matrix.framework }}.xcframework)
    needs: plan
    if: needs.plan.outputs.build_native == 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        framework:
          - zenoh-pico
          - cyclonedds
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # A workflow_dispatch recovery run must build the TAGGED source —
          # without an explicit ref it would build the dispatch ref (main)
          # and attach assets that do not match the tag.
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"
      - name: Install CMake
        run: |
          brew update
          brew install cmake
      - name: Build xcframework
        run: Scripts/build-xcframework.sh ${{ matrix.framework }} artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.framework }}-xcframework
          path: |
            artifacts/*.zip
            artifacts/*.checksum
          if-no-files-found: error
          retention-days: 7

  build-ros2-xcframework:
    name: Build (${{ matrix.framework }}.xcframework)
    # macos-26 + Xcode 26.4.1 to match ci-rcl.yml (the toolchain the ROS 2
    # cross-build is validated on). All six Apple slices per rmw variant.
    needs: plan
    if: needs.plan.outputs.build_ros2 == 'true'
    runs-on: macos-26
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: CRos2
            rmw_variant: cyclonedds
            slices: maccatalyst iphoneos iphonesimulator macosx xros xrsimulator
            build_dir: build/ros2
          # No xros/xrsimulator for the zenoh variant: zenoh-c's dependency
          # graph (pnet_sys 0.35) does not compile for visionOS yet, so those
          # slices are dropped by design — visionOS consumers stay on the
          # zenoh-pico wire path or the .dds transport.
          - framework: CRos2Zenoh
            rmw_variant: zenoh
            slices: maccatalyst iphoneos iphonesimulator macosx
            build_dir: build/ros2zenoh
    steps:
      - uses: actions/checkout@v4
        with:
          # Same tagged-source rule as the zenoh-pico/cyclonedds job above.
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.4.1.app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: brew install cmake
      # ament_cmake's package_xml_2_cmake.py runs under the runner's base
      # python (CMake's FindPython resolves to it, not the script's venv), so
      # the ROS 2 build deps must be importable there too.
      - name: Install ROS 2 build deps into runner python
        run: pip install -r Scripts/ros2/requirements.txt
      # The zenoh variant cross-builds zenoh-c (Rust staticlib) per slice.
      # This pre-warm targets the runner's default toolchain; build_zenohc
      # re-adds each target scoped to zenoh-c's pinned toolchain (its
      # rust-toolchain.toml governs the actual build). No visionOS triples:
      # the zenoh matrix ships no xros/xrsimulator slices (pnet_sys).
      - name: Install Rust cross targets (zenoh variant)
        if: matrix.rmw_variant == 'zenoh'
        run: |
          rustup target add \
            aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim \
            aarch64-apple-ios-macabi
      - name: Build ${{ matrix.framework }}.xcframework (all slices)
        env:
          RMW_VARIANT: ${{ matrix.rmw_variant }}
        run: Scripts/build-ros2-xcframework.sh ${{ matrix.slices }}
      - name: Zip + checksum
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ditto -c -k --keepParent \
            "${{ matrix.build_dir }}/${{ matrix.framework }}.xcframework" \
            "artifacts/${{ matrix.framework }}.xcframework.zip"
          swift package compute-checksum \
            "artifacts/${{ matrix.framework }}.xcframework.zip" \
            > "artifacts/${{ matrix.framework }}.xcframework.zip.checksum"
          cat "artifacts/${{ matrix.framework }}.xcframework.zip.checksum"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.framework }}-xcframework
          path: |
            artifacts/*.zip
            artifacts/*.checksum
          if-no-files-found: error
          retention-days: 7

  publish-xcframeworks:
    name: Publish (xcframeworks)
    # Publishing is intentionally gated on BOTH build jobs: once Package.swift
    # pins the CRos2* URLs, a release without the ros2 assets would be
    # broken for downstream anyway. The cost is that a transient failure in
    # the long ros2 cross-build blocks the whole release — RECOVERY: re-run
    # this workflow via workflow_dispatch with the existing tag; it re-attaches
    # (--clobber) all assets, rebuilding the groups whose inputs changed (all
    # of them with force_build).
    # A build job the plan skipped counts as done: its group is reused below.
    needs: [plan, release, build-xcframework, build-ros2-xcframework]
    if: >-
      !cancelled()
      && needs.plan.result == 'success'
      && needs.release.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.build-xcframework.result)
      && contains(fromJSON('["success", "skipped"]'), needs.build-ros2-xcframework.result)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.build_native == 'true' || needs.plan.outputs.build_ros2 == 'true'
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p artifacts upload
          find artifacts -type f \( -name "*.zip" -o -name "*.checksum" \) -exec cp {} upload/ \;
          ls -la upload
      - name: Reuse unchanged assets from the previous release
        if: needs.plan.outputs.build_native != 'true' || needs.plan.outputs.build_ros2 != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
          BUILD_NATIVE: ${{ needs.plan.outputs.build_native }}
          BUILD_ROS2: ${{ needs.plan.outputs.build_ros2 }}
        run: |
          set -euo pipefail
          frameworks=()
          [[ "$BUILD_NATIVE" == true ]] || frameworks+=(CZenohPico CCycloneDDS)
          [[ "$BUILD_ROS2" == true ]] || frameworks+=(CRos2 CRos2Zenoh)
          for fw in "${frameworks[@]}"; do
            gh release download "$PREVIOUS" --repo "${{ github.repository }}" --dir upload \
              --pattern "$fw.xcframework.zip" --pattern "$fw.xcframework.zip.checksum"
            # swift package compute-checksum is the file's SHA-256.
            actual=$(sha256sum "upload/$fw.xcframework.zip" | cut -d' ' -f1)
            expected=$(tr -d '[:space:]' < "upload/$fw.xcframework.zip.checksum")
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$fw.xcframework.zip from $PREVIOUS does not match its checksum file"
              exit 1
            fi
            echo "Reusing $fw.xcframework.zip from $PREVIOUS ($actual)"
          done
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber \
            upload/CZenohPico.xcframework.zip \
            upload/CZenohPico.xcframework.zip.checksum \
            upload/CCycloneDDS.xcframework.zip \
            upload/CCycloneDDS.xcframework.zip.checksum \
            upload/CRos2.xcframework.zip \
            upload/CRos2.xcframework.zip.checksum \
            upload/CRos2Zenoh.xcframework.zip \
            upload/CRos2Zenoh.xcframework.zip.checksum

      - name: Assert all expected assets present on the release
        # Fail loudly if the release is missing any expected asset.
        # The matrix `include:` shape used in build-xcframework can
        # silently drop a variant before upload, leading to incomplete
        # published bundles that look fine in workflow logs but break
        # `swift build` for the downstream consumer hitting the
        # missing slice. Caught late in #32 (Linux .artifactbundle);
        # the same matrix shape is reused in the Android release
        # pipeline (#29, #31). See https://github.com/swift-ros2/swift-ros2/issues/35.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          expected=(
            CZenohPico.xcframework.zip
            CZenohPico.xcframework.zip.checksum
            CCycloneDDS.xcframework.zip
            CCycloneDDS.xcframework.zip.checksum
            CRos2.xcframework.zip
            CRos2.xcframework.zip.checksum
            CRos2Zenoh.xcframework.zip
            CRos2Zenoh.xcframework.zip.checksum
          )
          actual=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | sort)
          echo "Actual assets on release $TAG:"
          while IFS= read -r line; do echo "  $line"; done <<<"$actual"
          missing=()
          for name in "${expected[@]}"; do
            if ! grep -Fxq "$name" <<<"$actual"; then
              missing+=("$name")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo
            echo "::error::Release $TAG is missing ${#missing[@]} expected asset(s):"
            printf '::error::  %s\n' "${missing[@]}"
            echo "::error::This usually means the build-xcframework matrix dropped a variant before upload."
            exit 1
          fi
          echo
          echo "All ${#expected[@]} expected assets present on release $TAG."
